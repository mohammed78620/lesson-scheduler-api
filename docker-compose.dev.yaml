version: "3.7"
services:
  web:
    env_file:
      - .env
    build: .
    restart: always
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - .:/app/
    environment:
      # SECRETS
      - SECRET_KEY=django-insecure-68g))^hu8*1eq01406e--+ujzmdalf=so_($s40v_!q3&ccg^+
      # DJANGO SETTINGS
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
      # DATABASE RELATED
      - DATABASE_NAME=db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=admin
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      - db
    networks:
      - net

  db:
    image: postgres:14.2-alpine
    restart: unless-stopped
    volumes:
      - ~/data/lesson_scheduler_api_possgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=db
    ports:
      - "5432:5432"
    networks:
      - net

  rabbit:
    hostname: rabbit
    image: rabbitmq:management
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=mypass
    ports:
      - "5672:5672"
      - "15672:15672"
    external_links:
      - rabbit:rabbit
    networks:
    - net

  celery:
    env_file:
      - .env
    build:
      dockerfile: Dockerfile-worker
    volumes:
      - .:/app/
    environment:
      # SECRETS
      - SECRET_KEY=django-insecure-68g))^hu8*1eq01406e--+ujzmdalf=so_($s40v_!q3&ccg^+
      # DJANGO SETTINGS
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
      # DATABASE RELATED
      - DATABASE_NAME=db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=admin
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      - rabbit
      - web
    networks:
    - net

  celery-beat:
    env_file:
      - .env
    build:
      dockerfile: Dockerfile-beat
    volumes:
      - .:/app
    environment:
      # SECRETS
      - SECRET_KEY=django-insecure-68g))^hu8*1eq01406e--+ujzmdalf=so_($s40v_!q3&ccg^+
      # DJANGO SETTINGS
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
      # DATABASE RELATED
      - DATABASE_NAME=db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=admin
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      - rabbit
    networks:
      - net

volumes:
  postgres_data:
    driver: local
  cache:
    driver: local

networks:
  net:
    driver: bridge
